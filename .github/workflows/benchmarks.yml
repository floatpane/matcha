name: Benchmarks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Resolve base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Benchmark PR
        run: |
          go test -run=^$ -bench=. -benchmem -benchtime=3x -count=6 ./backend/ ./tui/ \
            | tee new.txt

      - name: Checkout base
        run: git checkout ${{ steps.base.outputs.ref }}

      - name: Benchmark base
        run: |
          go test -run=^$ -bench=. -benchmem -benchtime=3x -count=6 ./backend/ ./tui/ \
            | tee old.txt || echo "base benchmarks failed" > old.txt

      - name: Restore PR checkout
        run: git checkout ${{ github.sha }}

      - name: Compare with benchstat
        id: compare
        run: |
          set +e
          benchstat old.txt new.txt | tee benchstat.txt
          {
            echo "report<<EOF"
            cat benchstat.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Classify result
        id: verdict
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re, sys
          worse, better = 0, 0
          with open("benchstat.txt") as f:
              for line in f:
                  m = re.search(r"([-+]?\d+\.\d+)%", line)
                  if not m:
                      continue
                  delta = float(m.group(1))
                  if "ns/op" in line or "B/op" in line or "allocs/op" in line:
                      if delta > 3:
                          worse += 1
                      elif delta < -3:
                          better += 1
          status = "neutral"
          if worse > 0 and worse >= better:
              status = "regression"
          elif better > 0:
              status = "improvement"
          print(f"status={status}")
          print(f"worse={worse}")
          print(f"better={better}")
          PY

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.compare.outputs.report }}
          STATUS: ${{ steps.verdict.outputs.status }}
          WORSE: ${{ steps.verdict.outputs.worse }}
          BETTER: ${{ steps.verdict.outputs.better }}
        with:
          github-token: ${{ secrets.HOMEBREW_GITHUB_TOKEN }}
          script: |
            const status = process.env.STATUS;
            const worse = process.env.WORSE;
            const better = process.env.BETTER;
            const headers = {
              regression: "### Benchmark report — regression detected",
              improvement: "### Benchmark report — improvement detected",
              neutral: "### Benchmark report — no significant change",
            };
            const body = [
              headers[status] || headers.neutral,
              `Metrics worse: **${worse}** · better: **${better}** (threshold: ±3%).`,
              "",
              "<details><summary>benchstat output</summary>",
              "",
              "```",
              process.env.REPORT || "(empty)",
              "```",
              "",
              "</details>",
              "",
              "<sub>auto-generated by benchmarks.yml</sub>",
            ].join("\n");

            const marker = "<sub>auto-generated by benchmarks.yml</sub>";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            old.txt
            new.txt
            benchstat.txt
