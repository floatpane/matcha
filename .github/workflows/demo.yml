name: Update Demo VHS

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-demo:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    name: Generate and Update Demo GIF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev zsh ffmpeg ttyd fonts-noto-color-emoji
          mkdir -p ~/.local/share/fonts
          wget -q https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/JetBrainsMono.zip
          unzip -o JetBrainsMono.zip -d ~/.local/share/fonts
          fc-cache -f
          go install github.com/charmbracelet/vhs@latest

      - name: Build Matcha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release view --json tagName -q ".tagName")
          echo "Found latest release: $LATEST_TAG"

          git fetch --tags

          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          go build -ldflags="-s -w -X main.version=$LATEST_TAG -X main.commit=$COMMIT -X main.date=$DATE" -o matcha .

      - name: Create fake inbox sandbox
        # Throwaway $HOME with a Maildir account of demo emails; demo.tape
        # points HOME and PATH at it, so nothing touches real mail.
        run: MATCHA_BIN="$PWD/matcha" .github/workflows/scripts/demo-sandbox.sh

      - name: Record demo GIF
        env:
          CLICOLOR_FORCE: "1"
        run: |
          TERM=xterm-256color vhs demo.tape
          ls -la public/assets/demo.gif

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.HOMEBREW_GITHUB_TOKEN }}
          commit-message: "docs: update demo.gif from release"
          title: "docs: update demo.gif"
          body: |
            ## What?

            Replaces `public/assets/demo.gif` with a freshly recorded VHS run.

            ## Why?

            Keeps the demo GIF aligned with the latest release so README and docs reflect current behaviour. Generated automatically by the Update Demo VHS workflow.
          branch: "update-demo-gif"
          base: "master"
          add-paths: public/assets/demo.gif
          labels: documentation
