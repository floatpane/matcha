services:
  greenmail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
        -Dgreenmail.verbose
    ports:
      - "3025:3025"   # SMTP
      - "3110:3110"   # POP3
      - "3143:3143"   # IMAP
      - "3465:3465"   # SMTPS (implicit TLS)
      - "3993:3993"   # IMAPS (implicit TLS)
      - "3995:3995"   # POP3S
      - "8080:8080"   # REST API
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/service/readiness || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30
